esphome:
  name: lilygo-deepsleep
  friendly_name: LilyGo E-Ink DeepSleep Demo

  on_boot:
    - priority: 600
      then:
        - lambda: |-
            ESP_LOGI("boot", "=== Device Boot ===");
            ESP_LOGI("boot", "Boot count: %d", id(boot_counter));
            ESP_LOGI("boot", "Free heap: %d bytes", heap_caps_get_free_size(MALLOC_CAP_8BIT));
            ESP_LOGI("boot", "Free PSRAM: %d bytes", heap_caps_get_free_size(MALLOC_CAP_SPIRAM));

  platformio_options:
    upload_speed: 921600
    monitor_speed: 115200
    board_build.mcu: esp32s3
    board_build.f_cpu: 240000000L
    board_build.arduino.memory_type: qspi_opi
    board_build.flash_size: 16MB
    board_build.flash_mode: qio
    board_build.flash_type: qspi
    board_build.psram_type: opi
    board_build.memory_type: qspi_opi
    board_build.boot_freq: 80m
    build_flags:
      - "-DBOARD_HAS_PSRAM"                    # Enable PSRAM support in code
      - "-DARDUINO_USB_CDC_ON_BOOT=1"          # Enable USB Serial on boot
      - "-mfix-esp32-psram-cache-issue"        # Hardware workaround for PSRAM cache bug

  libraries:
    - SPI

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    # CRITICAL for ESP-IDF 5.4.2+: Enable PSRAM initialization
    sdkconfig_options:
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_ESP32S3_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_BOOT_INIT: "y"
      CONFIG_SPIRAM_IGNORE_NOTFOUND: "n"

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "3lOPTl7UR0o3VsoD14h7Lnpd2Mvravq9TlKqcLhNrVc=" # example key

ota:
  - platform: esphome
    password: "ab46d04dc5fe3047cf3061e272a59123" # example password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fast connect for DeepSleep optimization
  fast_connect: true
  
  # Disable power saving for faster wake-up
  power_save_mode: none
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "DeepSleep Fallback"
    password: "M4bS2vSbHR93"

captive_portal:

# ═══════════════════════════════════════════════════════════
# DEEPSLEEP CONFIGURATION
# ═══════════════════════════════════════════════════════════
deep_sleep:
  id: deep_sleep_control
  # Sleep for 5 minutes
  sleep_duration: 5min
  
  # Wakeup on button press (GPIO21)
  wakeup_pin: GPIO21
  wakeup_pin_mode: INVERT_WAKEUP
  
  # Optional: Run specific actions before sleep
  on_sleep:
    then:
      - logger.log: "Going to sleep now..."
      - logger.log:
          format: "Next wake in 5 minutes or by button press"
          level: INFO

# ═══════════════════════════════════════════════════════════
# GLOBAL VARIABLES (persisted across deep sleep)
# ═══════════════════════════════════════════════════════════
globals:
  - id: boot_counter
    type: int
    restore_value: yes
    initial_value: '0'

# ═══════════════════════════════════════════════════════════
# SENSORS
# ═══════════════════════════════════════════════════════════
sensor:
  # WiFi Signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    on_value:
      then:
        - logger.log:
            format: "WiFi RSSI: %.1f dBm"
            args: ['x']
            level: DEBUG

  # Uptime in seconds (resets after deep sleep)
  - platform: uptime
    name: "Uptime"
    id: uptime_seconds
    update_interval: 10s
    on_value:
      then:
        # Warn if device has been awake too long
        - if:
            condition:
              lambda: 'return x > 90;'
            then:
              - logger.log:
                  format: "⚠️ Device awake for %.0f seconds - DeepSleep may not be working!"
                  args: ['x']
                  level: WARN

# ═══════════════════════════════════════════════════════════
# TEXT SENSORS
# ═══════════════════════════════════════════════════════════
text_sensor:
  # Deep Sleep status monitoring
  - platform: template
    name: "Deep Sleep Status"
    id: deep_sleep_status
    update_interval: 15s
    lambda: |-
      if (id(uptime_seconds).state < 15) {
        return {"Booting..."};
      } else if (id(uptime_seconds).state > 90) {
        return {"ERROR: Still awake!"};
      } else {
        return {"Preparing to sleep..."};
      }

# ═══════════════════════════════════════════════════════════
# BINARY SENSORS
# ═══════════════════════════════════════════════════════════
binary_sensor:
  # Button to manually prevent deep sleep
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    name: "Button 1"
    id: button_1
    on_press:
      then:
        - logger.log: "Button pressed - preventing sleep for 30s"
        - deep_sleep.prevent: deep_sleep_control
        - delay: 30s
        - deep_sleep.allow: deep_sleep_control
        - logger.log: "Sleep allowed again"

# ═══════════════════════════════════════════════════════════
# TIME (for display)
# ═══════════════════════════════════════════════════════════
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - logger.log: "Time synchronized with Home Assistant"

# ═══════════════════════════════════════════════════════════
# EXTERNAL COMPONENT
# ═══════════════════════════════════════════════════════════
external_components:
  - source:
      type: git
      url: https://github.com/hbast/esphome-lilygo-t547plus_esphome-2025.11
      ref: deepsleep-example
    components: ["t547"]
  # Alternative: Use main branch from original repo
  # - source: github://dabalroman/esphome-lilygo-t547plus_esphome-2025.11
  #   components: ["t547"]
  # For local development:
  # - source:
  #     type: local
  #     path: components/
  #   components: ["t547"]

# ═══════════════════════════════════════════════════════════
# FONTS
# ═══════════════════════════════════════════════════════════
font:
  - file: 
      type: gfonts
      family: Roboto
      weight: 700
    id: font_large
    size: 60
    
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_medium
    size: 32
    
  - file:
      type: gfonts
      family: "Roboto Mono"
      weight: 400
    id: font_small
    size: 20

# ═══════════════════════════════════════════════════════════
# DISPLAY WITH DEEPSLEEP
# ═══════════════════════════════════════════════════════════
display:
  - platform: t547
    id: lilygo_display
    greyscale: true
    
    # Update display on boot, then enter deep sleep
    update_interval: never
    
    lambda: |-
      ESP_LOGI("display", "=== Updating Display ===");
      
      // Increment boot counter
      id(boot_counter) += 1;
      ESP_LOGI("display", "Boot count: %d", id(boot_counter));
      
      // Clear screen
      it.fill(COLOR_OFF);
      
      // Title
      it.printf(480, 50, id(font_large), TextAlign::TOP_CENTER, "DeepSleep Demo");
      
      // Line
      it.line(100, 130, 860, 130);
      
      // Boot counter
      it.printf(480, 180, id(font_medium), TextAlign::TOP_CENTER, 
                "Boot #%d", id(boot_counter));
      
      // Current time
      auto time = id(homeassistant_time).now();
      if (time.is_valid()) {
        it.strftime(480, 250, id(font_medium), TextAlign::TOP_CENTER,
                    "Last Update: %H:%M:%S", time);
        ESP_LOGI("display", "Current time: %02d:%02d:%02d", 
                 time.hour, time.minute, time.second);
      } else {
        it.printf(480, 250, id(font_medium), TextAlign::TOP_CENTER,
                  "Time: Not synced");
        ESP_LOGW("display", "Time not synchronized yet");
      }
      
      // WiFi info
      if (id(wifi_signal_db).has_state()) {
        it.printf(480, 320, id(font_small), TextAlign::TOP_CENTER,
                  "WiFi: %.0f dBm", id(wifi_signal_db).state);
      }
      
      // Sleep info
      it.printf(480, 380, id(font_small), TextAlign::TOP_CENTER,
                "Sleeping for 5 minutes...");
      it.printf(480, 410, id(font_small), TextAlign::TOP_CENTER,
                "Press button to wake early");
      
      // Footer
      it.printf(480, 500, id(font_small), TextAlign::BOTTOM_CENTER,
                "Uptime: %.0fs", id(uptime_seconds).state);
      
      ESP_LOGI("display", "Display update complete");

# ═══════════════════════════════════════════════════════════
# SCRIPT: Update display then sleep
# ═══════════════════════════════════════════════════════════
script:
  - id: update_and_sleep
    mode: single
    then:
      - logger.log: "Starting update and sleep sequence..."
      
      # Wait for WiFi
      - wait_until:
          wifi.connected:
      - logger.log: "✓ WiFi connected"
      
      # Wait for time sync (with timeout)
      - wait_until:
          condition:
            lambda: 'return id(homeassistant_time).now().is_valid();'
          timeout: 30s
      - if:
          condition:
            lambda: 'return id(homeassistant_time).now().is_valid();'
          then:
            - logger.log: "✓ Time synchronized"
          else:
            - logger.log:
                format: "⚠️ Time sync timeout - continuing anyway"
                level: WARN
      
      # Update display
      - component.update: lilygo_display
      - logger.log: "✓ Display updated"
      
      # Wait for display to finish rendering
      - delay: 3s
      
      # Try to enter deep sleep
      - logger.log:
          format: "Entering deep sleep mode for 5 minutes..."
          level: INFO
      - deep_sleep.enter: deep_sleep_control
      
      # If we reach here, deep sleep FAILED!
      - delay: 1s
      - logger.log:
          format: "❌ CRITICAL: Failed to enter deep sleep!"
          level: ERROR
      - logger.log:
          format: "Device will stay awake - check deep sleep configuration!"
          level: ERROR

# ═══════════════════════════════════════════════════════════
# AUTOMATION: Auto-update on boot
# ═══════════════════════════════════════════════════════════
interval:
  - interval: 2s
    then:
      - if:
          condition:
            # Only run once after boot
            lambda: 'return id(boot_counter) > 0 && id(uptime_seconds).state < 5;'
          then:
            - script.execute: update_and_sleep
  
  # Monitor if deep sleep fails
  - interval: 30s
    then:
      - if:
          condition:
            # If device is awake for more than 60 seconds, deep sleep likely failed
            lambda: 'return id(uptime_seconds).state > 60;'
          then:
            - logger.log:
                format: "⚠️ WARNING: Device still awake after %.0f seconds - DeepSleep may have FAILED!"
                args: ['id(uptime_seconds).state']
                level: ERROR
            - logger.log:
                format: "Deep sleep state: %s"
                args: ['id(deep_sleep_control).is_sleeping() ? "SLEEPING" : "AWAKE"']
                level: ERROR
